<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Site Ledger</title>
<style>
:root{--bg:#f3f2ee;--ink:#1d2327;--mute:#6b7279;--line:#d9d6cc;--card:#fff;--acc:#e0a100;--red:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#171a1c;--ink:#ecebe6;--mute:#9aa1a7;--line:#2e3438;--card:#20252a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:#1d2327;color:#fff;border-bottom:4px solid var(--acc)}header b{font-size:18px;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button,select,input,.btn{font:inherit;padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:4px}
nav button{background:transparent;color:#ddd;border-color:#444}nav button.on{background:var(--acc);color:#111;border-color:var(--acc)}
main{padding:16px;max-width:1100px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);padding:12px}.k small{color:var(--mute)}.k div{font-size:24px;font-weight:600}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line)}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mute)}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;background:var(--line)}.LOW,.LOW_STOCK,.PENDING_MD{background:#fde7a8;color:#5a4000}.NEGATIVE,.NEGATIVE_STOCK,.REJECTED{background:#f6c7c3;color:#7a120c}.NORMAL,.APPROVED,.CLOSED{background:#c8e6c9;color:#14501a}
.btn{cursor:pointer}.btn.p{background:var(--acc);border-color:var(--acc);color:#111}.btn.r{color:var(--red)}form.row{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.box{max-width:340px;margin:8vh auto;display:grid;gap:10px;padding:16px}h2{margin:0 0 10px}.note{color:var(--mute);font-size:13px}:focus-visible{outline:3px solid var(--acc)}
</style></head><body>
<div id="setup" class="box" hidden><h2>Connect to data repo</h2><input id="o" placeholder="GitHub username or org"><input id="r" placeholder="Data repo name (private)"><input id="b" placeholder="Branch" value="main"><input id="t" type="password" placeholder="Access token"><button class="btn p" onclick="saveCfg()">Save</button><p class="note">Token needs read and write access to Contents on the data repo only. It stays in this browser.</p></div>
<div id="login" class="box" hidden><h2>Site Ledger</h2><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button class="btn p" onclick="login()">Sign in</button><button class="btn" onclick="L.removeItem('cfg');location.reload()">Change data repo</button></div>
<div id="app" hidden><header><b>Site Ledger</b><nav id="nav"></nav><select id="site" onchange="show(cur)"></select><span id="who"></span><button class="btn" onclick="L.removeItem('me');location.reload()">Sign out</button></header><main id="main"></main></div>
<script>
const L=localStorage,$=s=>document.querySelector(s),inr=n=>'₹'+Math.round(n||0).toLocaleString('en-IN'),id=()=>crypto.randomUUID().slice(0,8);
let CFG=JSON.parse(L.cfg||'null'),ME=JSON.parse(L.me||'null'),cur='dash',SITES=[],MATS=[];
// ---- GitHub JSON storage: read file + sha, change, write back; retry if someone else saved first ----
const H=()=>({Authorization:'Bearer '+CFG.token,Accept:'application/vnd.github+json'}),U=f=>`https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/data/${f}.json`;
async function rd(f){const r=await fetch(U(f)+`?ref=${CFG.branch}`,{headers:H(),cache:'no-store'});if(!r.ok)throw new Error(`Cannot read ${f}.json (${r.status}). Check repo name and token.`);const j=await r.json();return{sha:j.sha,data:JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))))}}
async function upd(f,fn,msg){for(let i=0;i<5;i++){const{sha,data}=await rd(f);const out=fn(data);
const r=await fetch(U(f),{method:'PUT',headers:H(),body:JSON.stringify({message:`${msg} by ${ME?ME.username:'setup'}`,branch:CFG.branch,sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,1))))})});
if(r.ok)return out;if(r.status!=409&&r.status!=422)throw new Error(`Save failed (${r.status})`)}throw new Error('Others are saving at the same time. Try again.')}
const aud=(action,detail)=>upd('audit',d=>{d.unshift({at:new Date().toISOString(),user:ME.username,action,detail});d.length=Math.min(d.length,500)},'audit');
const can=(...r)=>r.includes(ME.role);
// ---- Business rules ----
async function txn(siteId,materialId,type,qty,rate){
 if(!(qty>0))throw new Error('Quantity must be more than 0');const m=MATS.find(x=>x.id==materialId),S={RECEIPT:1,RETURN:1,CONSUMPTION:-1,DAMAGE:-1}[type];
 const inv=await upd('inventory',d=>{let i=d.find(x=>x.siteId==siteId&&x.materialId==materialId);if(!i){i={siteId,materialId,availableQty:0,minimumLimit:m.min,reorderQty:m.reorder,unitRate:0};d.push(i)}
  i.availableQty+=S*qty;if(type=='RECEIPT'&&rate)i.unitRate=rate;i.updated=new Date().toISOString();return{...i}},`Stock ${type} ${qty}`);
 await upd('transactions',d=>{d.unshift({id:id(),siteId,materialId,type,qty,rate,by:ME.username,at:new Date().toISOString()});d.length=Math.min(d.length,1000)},'Txn');
 await upd('alerts',d=>{const o=d.find(a=>a.siteId==siteId&&a.materialId==materialId&&a.status=='OPEN'),t=inv.availableQty<0?'NEGATIVE_STOCK':inv.availableQty<=inv.minimumLimit?'LOW_STOCK':null;
  if(!t){if(o)o.status='RESOLVED';return}const v={alertType:t,availableQty:inv.availableQty,minimumLimit:inv.minimumLimit,requiredQty:Math.max(0,inv.reorderQty-inv.availableQty),dept:m.dept};
  if(o)Object.assign(o,v);else d.unshift({id:id(),siteId,materialId,status:'OPEN',at:new Date().toISOString(),...v})},'Alert check');
 await aud('STOCK_'+type,{siteId,materialId,qty})}
const setReq=(rid,fn,msg)=>upd('requests',d=>{const r=d.find(x=>x.id==rid);if(!r)throw new Error('Request not found');return fn(r)},msg);
async function newReq(aid){const a=(await rd('alerts')).data.find(x=>x.id==aid);await upd('requests',d=>{d.unshift({id:id(),siteId:a.siteId,materialId:a.materialId,qty:a.requiredQty,status:'DRAFT',by:ME.username,at:new Date().toISOString()})},'New request')}
async function submitReq(rid){const supplier=prompt('Supplier name'),rate=+prompt('Quoted rate per unit');if(!supplier||!rate)return;
 await setReq(rid,r=>{if(r.status!='DRAFT')throw new Error('Only draft requests can be submitted');Object.assign(r,{supplier,rate,status:'PENDING_MD'})},'Submit request')}
async function decide(rid,ok){if(!can('MD'))throw new Error('Only MD can approve');const remarks=prompt('Remarks (optional)')||'';
 await setReq(rid,r=>{if(r.status!='PENDING_MD')throw new Error('Not pending MD approval');Object.assign(r,{status:ok?'APPROVED':'REJECTED',approvedBy:ME.username,remarks})},ok?'Approve':'Reject');await aud(ok?'APPROVE':'REJECT',{rid})}
async function issuePO(rid){let r0;await setReq(rid,r=>{if(r.status!='APPROVED')throw new Error('PO needs MD approval first');r.status='PO_ISSUED';r0={...r}},'Issue PO');
 await upd('orders',d=>{d.unshift({id:id(),rid,siteId:r0.siteId,materialId:r0.materialId,qty:r0.qty,rate:r0.rate,supplier:r0.supplier,received:0,status:'ISSUED',at:new Date().toISOString()})},'PO');await aud('ISSUE_PO',{rid})}
async function receive(oid){const qty=+prompt('Quantity delivered');if(!qty)return;let o;
 await upd('orders',d=>{o=d.find(x=>x.id==oid);if(!(qty>0)||o.received+qty>o.qty)throw new Error('Quantity exceeds the PO balance');o.received+=qty;o.status=o.received>=o.qty?'CLOSED':'PARTIAL'},'PO receipt');
 await setReq(o.rid,r=>{r.status=o.status=='CLOSED'?'FULLY_RECEIVED':'PARTIALLY_RECEIVED'},'Receipt');await txn(o.siteId,o.materialId,'RECEIPT',qty,o.rate)}
// ---- UI ----
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
function saveCfg(){L.cfg=JSON.stringify({owner:$('#o').value.trim(),repo:$('#r').value.trim(),branch:$('#b').value.trim()||'main',token:$('#t').value.trim()});location.reload()}
async function login(){try{const us=(await rd('users')).data,h=await sha($('#p').value),u=us.find(x=>x.username==$('#u').value.trim()&&x.hash==h);if(!u)return alert('Wrong username or password');L.me=JSON.stringify({username:u.username,name:u.name,role:u.role});location.reload()}catch(e){alert(e.message)}}
const TABS={dash:'Dashboard',inv:'Inventory',alerts:'Alerts',req:'Requests',po:'Orders',log:'Audit'};
async function init(){if(!CFG)return $('#setup').hidden=false;if(!ME)return $('#login').hidden=false;$('#app').hidden=false;$('#who').textContent=ME.name+' ('+ME.role+')';
 try{SITES=(await rd('sites')).data;MATS=(await rd('materials')).data}catch(e){return alert(e.message)}
 $('#site').innerHTML='<option value="">All sites</option>'+SITES.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
 $('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button id="t-${k}" onclick="show('${k}')">${v}</button>`).join('');show('dash')}
const sn=i=>(SITES.find(s=>s.id==i)||{}).name||i,mn=i=>{const m=MATS.find(x=>x.id==i);return m?m.name+' '+m.spec:i},tbl=(h,r)=>`<div class="wrap"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.length?r.join(''):`<tr><td colspan="${h.length}">Nothing here yet.</td></tr>`}</table></div>`;
const go=fn=>async(...a)=>{try{await fn(...a);show(cur)}catch(e){alert(e.message)}};
const A={newReq:go(newReq),submitReq:go(submitReq),decide:go(decide),issuePO:go(issuePO),receive:go(receive)};
async function show(t){cur=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id=='t-'+t));const sid=$('#site').value,f=a=>a.filter(x=>!sid||x.siteId==sid),m=$('#main');m.innerHTML='Loading…';
 try{
 if(t=='dash'){const[inv,po,al,rq]=(await Promise.all(['inventory','orders','alerts','requests'].map(rd))).map(x=>f(x.data));
  m.innerHTML=`<div class="grid">${[['Active sites',SITES.length],['Stock value',inr(inv.reduce((s,i)=>s+Math.max(0,i.availableQty)*i.unitRate,0))],['Ordered value',inr(po.reduce((s,p)=>s+p.qty*p.rate,0))],['Received value',inr(po.reduce((s,p)=>s+p.received*p.rate,0))],['Open alerts',al.filter(a=>a.status=='OPEN').length],['Drafts to submit',rq.filter(r=>r.status=='DRAFT').length],['Waiting for MD',rq.filter(r=>r.status=='PENDING_MD').length]].map(([a,b])=>`<div class="k"><small>${a}</small><div>${b}</div></div>`).join('')}</div><p class="note">Stock, ordered and received values are separate figures. Do not add them together.</p>`}
 if(t=='inv'){const d=f((await rd('inventory')).data);m.innerHTML='<h2>Material inventory</h2>'+(can('MD','GM','STORE','SITE_INCHARGE')?`<form class="row" onsubmit="event.preventDefault();const f=new FormData(this);go(txn)(f.get('s'),f.get('m'),f.get('t'),+f.get('q'),+f.get('r')||0)"><select name="s">${SITES.map(s=>`<option value="${s.id}">${s.name}</option>`)}</select><select name="m">${MATS.map(x=>`<option value="${x.id}">${x.name} ${x.spec} (${x.unit})</option>`)}</select><select name="t"><option>RECEIPT</option><option>CONSUMPTION</option><option>RETURN</option><option>DAMAGE</option></select><input name="q" type="number" step="any" placeholder="Qty" required><input name="r" type="number" step="any" placeholder="Rate (receipt)"><button class="btn p">Record</button></form>`:'')+tbl(['Site','Material','Available','Minimum','Rate','Value','Status'],d.map(i=>{const s=i.availableQty<0?'NEGATIVE':i.availableQty<=i.minimumLimit?'LOW':'NORMAL';return`<tr><td>${sn(i.siteId)}</td><td>${mn(i.materialId)}</td><td>${i.availableQty}</td><td>${i.minimumLimit}</td><td>${inr(i.unitRate)}</td><td>${inr(i.availableQty*i.unitRate)}</td><td><span class="tag ${s}">${s}</span></td></tr>`}))}
 if(t=='alerts'){const d=f((await rd('alerts')).data).filter(a=>a.status=='OPEN');m.innerHTML='<h2>Open stock alerts</h2>'+tbl(['Site','Material','Type','Department','Available','Minimum','Order qty',''],d.map(a=>`<tr><td>${sn(a.siteId)}</td><td>${mn(a.materialId)}</td><td><span class="tag ${a.alertType}">${a.alertType}</span></td><td>${a.dept}/Purchase</td><td>${a.availableQty}</td><td>${a.minimumLimit}</td><td>${a.requiredQty}</td><td>${can('MD','GM','PURCHASE','STORE','SITE_INCHARGE')?`<button class="btn" onclick="A.newReq('${a.id}')">Create purchase request</button>`:''}</td></tr>`))}
 if(t=='req'){const d=f((await rd('requests')).data);m.innerHTML='<h2>Purchase requests</h2>'+tbl(['Site','Material','Qty','Supplier','Rate','Status','Action'],d.map(r=>`<tr><td>${sn(r.siteId)}</td><td>${mn(r.materialId)}</td><td>${r.qty}</td><td>${r.supplier||''}</td><td>${r.rate?inr(r.rate):''}</td><td><span class="tag ${r.status}">${r.status}</span></td><td>${r.status=='DRAFT'&&can('PURCHASE','MD','GM')?`<button class="btn" onclick="A.submitReq('${r.id}')">Add quote, send to MD</button>`:r.status=='PENDING_MD'&&can('MD')?`<button class="btn p" onclick="A.decide('${r.id}',true)">Approve</button> <button class="btn r" onclick="A.decide('${r.id}',false)">Reject</button>`:r.status=='APPROVED'&&can('PURCHASE','MD')?`<button class="btn p" onclick="A.issuePO('${r.id}')">Issue purchase order</button>`:''}</td></tr>`))}
 if(t=='po'){const d=f((await rd('orders')).data);m.innerHTML='<h2>Purchase orders</h2>'+tbl(['Site','Material','Supplier','Ordered','Received','Status',''],d.map(p=>`<tr><td>${sn(p.siteId)}</td><td>${mn(p.materialId)}</td><td>${p.supplier}</td><td>${p.qty}</td><td>${p.received}</td><td><span class="tag ${p.status}">${p.status}</span></td><td>${p.status!='CLOSED'&&can('STORE','MD','GM')?`<button class="btn" onclick="A.receive('${p.id}')">Record delivery</button>`:''}</td></tr>`))}
 if(t=='log'){const d=(await rd('audit')).data;m.innerHTML='<h2>Audit log</h2>'+tbl(['When','User','Action','Detail'],d.slice(0,100).map(a=>`<tr><td>${new Date(a.at).toLocaleString('en-IN')}</td><td>${a.user}</td><td>${a.action}</td><td>${JSON.stringify(a.detail)}</td></tr>`))}
 }catch(e){m.innerHTML='<p>'+e.message+'</p>'}}
init();
</script></body></html>
